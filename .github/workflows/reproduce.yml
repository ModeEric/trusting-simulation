name: Reproduce licensed public studies
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python scripts/verify_release.py
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m src.reproduce_public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-reproduction-results
          path: results/
